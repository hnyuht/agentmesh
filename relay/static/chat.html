<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AgentMesh</title>
<link rel="stylesheet" href="chat.css">
</head>
<body>
  <header>
    <h1>AgentMesh</h1>
    <span id="status">connecting…</span>
  </header>
  <main id="log"></main>
  <form id="composer">
    <input id="input" type="text" placeholder="Message the mesh, or /pause &lt;agent_id&gt;, /resume &lt;agent_id&gt;" autocomplete="off">
    <button type="submit">Send</button>
  </form>
  <script src="chat.js"></script>
</body>
</html>
